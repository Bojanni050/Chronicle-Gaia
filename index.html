
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chronicle AI Archive</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontSize: {
                        'xs': '0.95rem',
                        'sm': '1.2rem',
                        'base': '1.1rem',
                    },
                    colors: {
                        'warm-beige': '#F2F1EC',
                        'paper': '#FBFBF9',
                        'sandstone': '#E6E5DF',
                        'sage-green': '#8A9482',
                        'terracotta': '#D27D66',
                        'moss-brown': '#7A7871',
                        'earth-dark': '#2E2D2A', // Custom dark text for contrast
                        'surface-ai': '#F5F6F1',
                        'accent-ai': '#B2C9A1',
                        'accent-ai-text': '#2C3E21',
                        'hover-bg': '#EBEAE4',
                        'tag-bg': '#EDECE6',
                    },
                    fontFamily: {
                        sans: ['"Manrope"', 'sans-serif'],
                        serif: ['"IBM Plex Sans"', 'sans-serif'],
                        mono: ['"IBM Plex Mono"', 'monospace'],
                        philosopher: ['"Manrope"', 'sans-serif'],
                        muli: ['"IBM Plex Sans"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;500;600;700;800&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #FBFBF9; /* Paper */
            color: #2E2D2A; /* Earth Dark */
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            font-feature-settings: "ss01", "cv11";
        }

        .dark body {
            background-color: #1c1917; /* Stone 900 */
            color: #f5f5f4;
        }
        
        /* Apply Heading Font (Manrope) to UI elements */
        h1, h2, h3, h4, h5, h6, 
        button, input, select, textarea, label, 
        .font-sans {
            font-family: 'Manrope', sans-serif;
            letter-spacing: -0.02em;
        }

        .mono {
            font-family: 'IBM Plex Mono', ui-monospace, monospace;
        }

        .font-display {
            font-family: 'Manrope', sans-serif;
            letter-spacing: -0.025em;
        }

        ::selection {
            background: #B2C9A1; /* Accent AI */
            color: #2C3E21; /* Accent AI Text */
        }

        ::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #E6E5DF; /* Sandstone */
            border-radius: 6px;
            border: 2px solid #FBFBF9;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #7A7871; /* Moss Brown */
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
